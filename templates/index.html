<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Service Desk Cloud</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
  <h2>Tickets de Soporte</h2>
  <a href="/formulario" class="btn btn-primary mb-3">Crear Nuevo Ticket</a>

  <table class="table table-striped">
    <thead>
      <tr>
        <th>ID</th><th>Título</th><th>Estado</th>
      </tr>
    </thead>
    <tbody>
      {% for t in tickets %}
      <tr>
        <td>{{ t.id }}</td>
        <td>{{ t.titulo }}</td>
        <td><span class="badge {{ 'bg-success' if t.estado == 'Cerrado' else 'bg-warning'  }}">{{ t.estado }}</span></td>
      </tr>
      {% endfor %}
    </tbody>
  </table>

  <hr>
  <h3>Informe XML</h3>
  <p><strong>Total:</strong> {{ total }} | <strong>Porcentaje Resueltos:</strong> {{ porcentaje }}%</p>
  <pre style="background: #f4f4f4; padding: 15px; border: 1px solid #ddd;">{{ xml }}</pre>
</body>
</html>
